[build-system]
# >=1.27 for PEP 639 license expression / license-files support
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "ansible-rehearse"
version = "0.1.1"
description = "Rehearse Ansible playbooks in a throwaway container and see the real state diff - packages, files, services, ports - before you touch production."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Bogdan Colceriu", email = "colceriu.bogdan10@gmail.com" }]
requires-python = ">=3.10"
dependencies = [
    "typer>=0.12",
    "rich>=13.0",
    "PyYAML>=6.0",
]
keywords = ["ansible", "dry-run", "diff", "plan", "preview", "devops", "testing"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Systems Administration",
    "Topic :: Software Development :: Testing",
]

[project.urls]
Homepage = "https://github.com/bogdancolceriu/ansible-rehearse"
Repository = "https://github.com/bogdancolceriu/ansible-rehearse"
Issues = "https://github.com/bogdancolceriu/ansible-rehearse/issues"
Changelog = "https://github.com/bogdancolceriu/ansible-rehearse/blob/main/CHANGELOG.md"

[project.scripts]
rehearse = "ansible_rehearse.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ansible_rehearse"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "docker: end-to-end tests that need a working Docker/Podman engine",
    "systemd: end-to-end tests that need a systemd-capable container image",
]
addopts = "-m 'not docker and not systemd'"

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF"]
ignore = ["SIM108"]

[tool.ruff.lint.per-file-ignores]
# B008: typer's Option/Argument-in-default is the documented API of the library.
"src/ansible_rehearse/cli.py" = ["B008"]
